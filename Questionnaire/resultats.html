<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="style.css" rel="stylesheet">
    <title>Résultats - Sensibilisation à la cybersécurité</title>
    <script src="resultats.js" defer></script>
</head>
<body>
    <header>
        <h1>Résultats du questionnaire</h1>
    </header>

    <main class="result-container">
        <p id="result-score" class="result-text"></p>
        <p id="result-niveau" class="result-text"></p>
        <p id="result-nom" class="result-text"></p>
        <p id="result-message" class="result-message"></p>
        <div id="result-review" class="result-review"></div>

        <div class="result-actions">
            <button id="btn-export-results" class="fr-btn" type="button">Exporter mes résultats</button>
        </div>

        <label for="question-edit">Modifier une question</label>
        <div class="edit-question-row">
            <select name="questions" id="question-edit">
                <option value="">--- Veuillez sélectionner une question ---</option>
            </select>
            <button id="btn-edit-question" class="fr-btn" type="button">Modifier la question sélectionnée</button>
        </div>
        
        <div class="bouton-revenir">
            <button class="fr-btn" type="button" onclick="history.back()">Revenir à l'accueil</button>
        </div>
    
    </main>
</body>
</html>
