<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style3.css" rel="stylesheet">
    <title>Questionnaire</title>
    <script src="script.js" defer></script>

</head>

<body>

    <header>
        <h1>Questionnaire Facile</h1>
    </header>


    <div class="question" id="q1">
        <h2>Question 1</h2>
        <h3>Quel est le mot de passe le plus sécurisé ?</h3>

        <!--Propositions de réponses pour la question 1-->

        <label><input type="checkbox" name="q1" value="1234"> 1234</label><br>
        <label><input type="checkbox" name="q1" value="0000"> 0000</label><br>
        <label><input type="checkbox" name="q1" value="azerty"> Azerty</label><br>
        <label><input type="checkbox" name="q1" value="g7!pl9@vq2#rt"> G7!pL9@vQ2#rT</label><br>

    </div>

    <div class="question" id="q2" style="display:none;">
        <h2>Question 2</h2>
        <h3>Vous avez reçu une clé USB lors d'une conférence, pensez-vous qu'il soit risqué de la brancher sur votre ordinateur ?</h3>
        
        <!--Propositions de réponses pour la question 2-->

        <label><input type="checkbox" name="q2" value="oui"> Oui</label><br>
        <label><input type="checkbox" name="q2" value="non"> Non</label><br>
        

    </div>

    <div class="question" id="q3" style="display:none;">
        <h2>Question 3</h2>
        <h3>Quels sont les bonnes pratiques ?</h3>
        
        <!--Propositions de réponses pour la question 3-->

        <label><input type="checkbox" name="q3" value="melangez"> Mélanger votre messagerie professionnelle et personnelle</label><br>
        <label><input type="checkbox" name="q3" value="separez"> Séparez travail et personnel</label><br>
        <label><input type="checkbox" name="q3" value="utilisez1"> Utilisez plusieurs adresses électroniques</label><br>
        <label><input type="checkbox" name="q3" value="utilisez2"> Utilisez une seule adresse électronique</label><br>
        

    </div>

    <p id="result-q1"></p> <!-- Résultat pour savoir si la question a bien été repondue ou pas -->

    <p id="result-q2"></p> <!-- Résultat pour savoir si la question a bien été repondue ou pas --> 
    

    <p id="result-q3"></p> <!-- Résultat pour savoir si la question a bien été repondue ou pas --> 

    <button id="btn-valider-q1" class="fr-btn" type="button" onclick="checkQ1()">Valider votre réponse</button> <!-- Bouton pour valider la réponse de la question 1 -->

    <button id="tn-valider-q2" class="fr-btn" type="button" onclick="checkQ2()">Valider votre réponse</button> <!-- Bouton pour valider la réponse de la question 2 -->
    

    <button class="fr-btn" type="button" onclick="showQuestion('q2')">Passer à la prochaine question</button> <!-- Bourton pour passer à la question 2 -->


    

    <button class="fr-btn" type="button" onclick="history.back()">
            Revenir à l'accueil
        </button>
    </div>

    
</body>
</html>
