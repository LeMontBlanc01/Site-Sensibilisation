<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style3.css" rel="stylesheet">
    <title>Résultats - Sensibilisation à la cybersécurité</title>
    <script src="resultats.js" defer></script>
</head>
<body>
    <header>
        <h1>Résultats du questionnaire</h1>
    </header>

    <main class="result-container">
        <p id="result-score" class="result-text"></p>
        <p id="result-niveau" class="result-text"></p>
        <p id="result-nom" class="result-text"></p>
        <p id="result-message" class="result-message"></p>

        <div class="result-actions">
            <button id="btn-export-results" class="fr-btn" type="button">Exporter mes résultats</button>
            <button id="btn-restart" class="fr-btn" type="button">Revenir au questionnaire</button>
        </div>
    </main>
</body>
</html>
