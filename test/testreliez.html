        <label><input type="radio" name="q15" value="partager"> Partager l'e-mail publiquement</label><br>

        <div class="imgf15">
            <img src="https://images.ctfassets.net/5i1m3im8l2b5/3wIRSBd1uuCeOlSr34Snlq/22d42b323358ba2de10db9560a9393a3/10-tips-to-prevent-phishing.png?w=1200&h=630&q=50&fm=png" alt="phishing2">
